<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Oakhaven — Page 1: The Black Well</title>
<style>
  /* 100% offline: fonts are local woff2 files in fonts/, loaded below.
     No Google Fonts CDN, no Phaser CDN, no Base64 inlining. */
  @font-face {
    font-family: 'IM Fell English'; font-style: normal; font-weight: 400;
    font-display: swap; src: url('fonts/im-fell-english-regular.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IM Fell English'; font-style: italic; font-weight: 400;
    font-display: swap; src: url('fonts/im-fell-english-italic.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 500;
    font-display: swap; src: url('fonts/cormorant-garamond-500.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 600;
    font-display: swap; src: url('fonts/cormorant-garamond-600.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 500;
    font-display: swap; src: url('fonts/cormorant-garamond-500-italic.woff2') format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #1a1714;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IM Fell English', 'Cormorant Garamond', Georgia, serif;
    overflow: hidden;
  }
  #game { width: 390px; height: 844px; max-width: 100vw; max-height: 100vh; }
  #game canvas { display: block; margin: 0 auto; border-radius: 4px;
    box-shadow: 0 0 0 1px #2B2623, 0 18px 50px rgba(0,0,0,.65); }
  @media (max-width: 420px) { #game { width: 100vw; height: 100vh; } }
</style>
<!-- Phaser 3.80.1, local file — never CDN, never inlined as Base64. -->
<script src="phaser.min.js"></script>
</head>
<body>
  <div id="game"></div>
  <script src="game.js"></script>
  <script>
    // Start the game only after the storybook fonts are ready, so
    // IM Fell English / Cormorant Garamond render instead of a fallback.
    // 3s timeout fallback: never block the game if fonts fail to load.
    var started = false;
    function startOnce() {
      if (started) return;
      started = true;
      window.startOakhavenGame();
    }
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(startOnce);
      setTimeout(startOnce, 3000);
    } else {
      startOnce();
    }
  </script>
</body>
</html>
